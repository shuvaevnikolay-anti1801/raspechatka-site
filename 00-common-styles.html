/* Precise responsive refinements for the third screen. */
.value-quality {
  background: #11130f;
}

.value-quality-image {
  inset: 0 0 0 50%;
  width: 50%;
  border-left: 1px solid rgba(255, 255, 255, .22);
}

.value-quality-image img {
  object-fit: cover;
  object-position: center;
}

.value-quality-shade {
  display: none;
}

.value-quality-copy {
  width: 46%;
  max-width: 46%;
}

.value-quality-copy > strong,
.value-quality-copy > p {
  max-width: 100%;
  overflow-wrap: normal;
}

.service-media {
  position: relative;
  min-width: 0;
  min-height: 340px;
  overflow: hidden;
}

.service-media .service-book-photo {
  width: 100%;
  height: 100%;
  min-height: 340px;
}

.service-standard-button {
  position: absolute;
  z-index: 2;
  right: 18px;
  bottom: 18px;
  left: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 48px;
  padding: 0 15px 0 17px;
  border: 1px solid #11130f;
  color: #11130f;
  background: #baff32;
  box-shadow: 5px 5px 0 #11130f;
  font-size: 9px;
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: .55px;
  text-align: left;
  text-transform: uppercase;
  cursor: default;
}

.service-standard-button span {
  flex: 0 0 auto;
  margin-left: 10px;
  font-size: 18px;
  line-height: 1;
}

.service-standard-button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.product-gifts-generator {
  right: 18px;
  bottom: 18px;
  left: 18px;
  max-width: none;
  min-height: 48px;
  padding: 0 15px 0 17px;
  border: 1px solid #11130f;
  background: #baff32;
  box-shadow: 5px 5px 0 #11130f;
}

.product-gifts-generator:hover {
  background: #c6ff4f;
  box-shadow: 5px 7px 0 #11130f;
}

.return-loyalty-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(100%, 340px);
  min-height: 52px;
  margin: 18px 5px 0 auto;
  padding: 0 15px 0 17px;
  border: 1px solid #baff32;
  color: #fff;
  background: transparent;
  box-shadow: 5px 5px 0 #baff32;
  font-size: 9px;
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: .55px;
  text-align: left;
  text-transform: uppercase;
  cursor: default;
  transition: color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .2s ease;
}

.return-loyalty-button span {
  flex: 0 0 auto;
  margin-left: 12px;
  color: #baff32;
  font-size: 18px;
  line-height: 1;
}

.return-loyalty-button:hover {
  color: #11130f;
  background: #baff32;
  box-shadow: 5px 7px 0 #fff;
  transform: translateY(-2px);
}

.return-loyalty-button:hover span {
  color: #11130f;
}

.return-loyalty-button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.atmosphere-features-location {
  margin-top: 8px !important;
}

.niche-street-visual strong {
  max-width: 100%;
  font-size: clamp(42px, 4vw, 59px);
  line-height: .92;
  letter-spacing: -3.5px;
}

.niche-training-visual .niche-training-message,
.niche-competition-visual .niche-competition-message {
  max-width: 100%;
  font-size: clamp(32px, 3vw, 44px);
  line-height: .94;
  letter-spacing: -2.2px;
}

.niche-competition-visual {
  display: block;
}

@media (max-width: 1180px) and (min-width: 960px) {
  .value-quality-image {
    inset: 0 0 0 50%;
    width: 50%;
  }

  .value-quality-copy {
    width: 46%;
    max-width: 46%;
  }

  .value-quality-copy > strong {
    font-size: 25px;
    line-height: 26px;
  }
}

@media (max-width: 959px) and (min-width: 640px) {
  .value-service {
    grid-template-columns: minmax(250px, 40%) 1fr;
  }
}

@media (max-width: 639px) {
  .value-quality {
    min-height: 520px;
  }

  .value-quality-image {
    inset: auto 0 0;
    width: 100%;
    height: 50%;
    border-top: 1px solid rgba(255, 255, 255, .22);
    border-left: 0;
  }

  .value-quality-copy {
    width: 100%;
    max-width: 100%;
  }

  .value-service {
    grid-template-columns: 1fr;
  }

  .service-media,
  .service-media .service-book-photo {
    height: 230px;
    min-height: 230px;
  }

  .service-standard-button {
    right: 16px;
    bottom: 16px;
    left: 16px;
    min-height: 52px;
    font-size: 10px;
  }

  .product-gifts-generator {
    right: 16px;
    bottom: 16px;
    left: 16px;
    min-height: 52px;
  }

  .value-atmosphere-copy {
    width: 100%;
  }

  .value-atmosphere-copy > div {
    gap: 6px;
  }

  .value-atmosphere-copy > div b {
    padding: 8px 9px;
    font-size: 9px;
  }

  .niche-street-visual strong {
    font-size: 46px;
  }

  .niche-training-visual .niche-training-message,
  .niche-competition-visual .niche-competition-message {
    font-size: 36px;
  }
}

/* Product collage becomes a readable catalogue below desktop width. */
@media (max-width: 959px) {
  .demand-product-grid.product-hierarchy {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    grid-template-rows: none !important;
    grid-auto-rows: minmax(360px, auto);
    gap: 12px;
    border: 0;
  }

  .demand-product-grid.product-hierarchy > article {
    grid-column: auto !important;
    grid-row: auto !important;
    min-width: 0;
    min-height: 360px;
    border: 1px solid rgba(17, 19, 15, .18);
    background: #e6e7e2;
  }

  .product-service-image img,
  .product-docs-portrait img,
  .product-gifts-image img {
    object-fit: contain !important;
    object-position: center !important;
    transform: none !important;
  }

  .product-service-image,
  .product-docs-portrait,
  .product-gifts-image {
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  .product-basic-copy .product-service-image {
    background-image: url('https://static.tildacdn.com/tild3430-3533-4434-a337-353238383461/copy-services-respon.webp');
  }

  .product-docs-large .product-docs-portrait {
    background-image: url('https://static.tildacdn.com/tild6239-6132-4865-a135-343539336662/photo-documents-resp.webp');
  }

  .product-basic-photo .product-service-image {
    background-image: url('https://static.tildacdn.com/tild3565-3239-4237-a537-623262373666/photo-printing-respo.webp');
  }

  .product-gifts-flagship .product-gifts-image {
    background-image: url('https://static.tildacdn.com/tild3239-6430-4534-b962-653831633231/personalized-gifts-r.webp');
  }

  .product-tile-tag {
    right: 14px;
    left: 14px;
    width: auto;
    max-width: none;
    padding: 12px 14px 11px;
    font-size: 12px;
    line-height: 1.25;
    white-space: normal;
    overflow-wrap: normal;
  }
}

@media (max-width: 639px) {
  .demand-product-grid.product-hierarchy {
    grid-template-columns: 1fr !important;
    grid-auto-rows: minmax(300px, auto);
    gap: 14px;
  }

  .demand-product-grid.product-hierarchy > article {
    min-height: 300px;
  }

  .demand-product-grid.product-hierarchy > .product-docs-large {
    min-height: 430px;
  }

  .product-tile-tag {
    top: 12px;
    right: 12px;
    left: 12px;
    padding: 11px 12px 10px;
    font-size: 11px;
  }

  .product-gifts-generator {
    right: 12px;
    bottom: 12px;
    left: 12px;
  }
}

.calculator-inline-cta {

  color: #fff;

}

.calculator-inline-cta span { min-width: 0; }
.calculator-inline-cta small { display: block; color: rgba(255,255,255,.48); font-size: 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.calculator-inline-cta strong { display: block; margin-top: 7px; font-size: 14px; line-height: 1.12; letter-spacing: -.25px; }
.calculator-inline-cta i { display: flex; align-items: center; justify-content: center; flex: 0 0 46px; width: 46px; height: 46px; color: var(--lead-ink); background: var(--lead-acid); font-size: 19px; font-style: normal; }

.partnership-cta--lead > div span {
  display: block;

  text-transform: uppercase;
}

.partnership-cta.partnership-cta--lead {

.lead-application {
  position: relative;
  width: 100%;
  max-width: 1440px;

  color: #fff;

  overflow: hidden;
}

.lead-application__grid {
  position: absolute;
  inset: 0;
  opacity: .13;
  background-image: linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
  background-size: 72px 72px;
  pointer-events: none;
}

.lead-application__bar {
  position: relative;
  z-index: 1;
  display: flex;

  letter-spacing: 1.1px;
  text-transform: uppercase;

.lead-application__body {

  display: grid;

  gap: 72px;
  align-items: end;
  min-height: 560px;
  padding: 70px 58px 76px;
}

.lead-phone-form {

.lead-phone-form input::placeholder { color: rgba(17,19,15,.28); }

.lead-messenger-choice { min-width: 0; margin: 2px 0 0; padding: 0; border: 0; }

.lead-messenger-choice label > span { display: grid; grid-template-columns: 42px 1fr; grid-template-rows: 1fr 1fr; column-gap: 12px; align-items: center; min-height: 66px; padding: 10px 14px 10px 10px; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.04); transition: border-color .2s ease, background-color .2s ease; }

.lead-phone-form button {

html,
body {
  max-width: 100%;
  overflow-x: clip;
}

.page-canvas,
.page-canvas > *,
.hero-layout > *,
.footer-main > *,
.lead-application__body > * {
  min-width: 0;
  max-width: 100%;
}

img,
svg,
video,
canvas,
iframe,
button,
input,
select,
textarea {
  max-width: 100%;
}

.headline-row,
.landing-screen h2,
.lead-application h2,
.final-meeting h2 {

  word-break: normal;
}

/* The fifth reason carries the acid accent; the sixth returns to paper. */
.niche-reason.niche-reason-competition {
  color: #11130f !important;
  background: #baff32 !important;
}

.niche-reason.niche-reason-ai {
  color: #11130f !important;
  background: #f7f7f1 !important;
}

/* Keep diagonal CTA arrows in text presentation on every device. */
.demand-audience-note > span,
.product-gifts-generator > span,
.service-standard-button > span,
.return-loyalty-button > span,
.lead-phone-form button > i,
.final-meeting button > span {
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 0 !important;
  font-variant-emoji: text;
}

.demand-audience-note > span::before,
.product-gifts-generator > span::before,
.service-standard-button > span::before,
.return-loyalty-button > span::before,
.lead-phone-form button > i::before,
.final-meeting button > span::before {

  font-size: 21px;
  line-height: 1;
}

@media (min-width: 1025px) {
